name: Release Atena Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            os-name: 'macos-arm64'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            os-name: 'windows-x64'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            os-name: 'linux-x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            squashfs-tools \
            patchelf \
            ffmpeg

      - name: Prepare sidecars (macOS / Linux)
        if: matrix.platform != 'windows-latest'
        run: |
          bash scripts/setup-sidecars.sh

      - name: Prepare sidecars (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          .\scripts\setup-sidecars.ps1

      - name: Install Node dependencies
        run: |
          pnpm install
          cd frontend && pnpm install

      - name: Normalize Tauri signing key
        shell: bash
        run: |
          TRIMMED_KEY=$(echo -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\r\n[:space:]')
          echo "TAURI_SIGNING_KEY=$TRIMMED_KEY" >> $GITHUB_ENV

      - name: Build Tauri Application & Create Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: 'true'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Atena Studio ${{ github.ref_name }}'
          releaseBody: 'See release assets and changelog for Atena Studio ${{ github.ref_name }}.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
